$kind: http-request
url: "{{api}}/auth/teste"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "usuario_id": 1 }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200))
      pm.test('entrou como Diego', () => pm.expect(pm.response.json().usuario.nome).to.equal('Diego Martins'))
    language: text/javascript
order: 9000
