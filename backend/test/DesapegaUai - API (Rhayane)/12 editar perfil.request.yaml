$kind: http-request
url: "{{api}}/perfil"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{ "telefone": "(31) 99752-6486", "bio": "Testando a edição do perfil." }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200))
      pm.test('telefone só com números', () => pm.expect(pm.response.json().telefone).to.equal('31997526486'))
    language: text/javascript
order: 12000
